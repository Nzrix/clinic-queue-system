version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: clinic-queue-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: clinic_queue
      TZ: Asia/Bangkok
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinic-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic-queue-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clinic_queue?serverTimezone=Asia/Bangkok
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - clinic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinic-queue-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - clinic-network

volumes:
  mysql_data:

networks:
  clinic-network:
    driver: bridge
